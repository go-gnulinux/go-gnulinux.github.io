baseURL = "https://go-gnulinux.github.io/"
title = "go-gnulinux"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

# Each repo card.
# "kind"  = which slice: transport / factors.
# "type"  = lib (importable module) vs tool.
# "ci"    = true only where a GitHub Actions ci.yml actually exists, so the CI
#           badge never renders an empty "no status" -- honest badges only.
# "blurb" = drawn straight from each repo's README.
[[params.repos]]
  name = "fido"
  kind = "transport"
  type = "lib"
  version = "v0.1.1"
  ci = true
  blurb = "A FIDO security key over `hidraw`: `/sys/class/hidraw` enumeration, the `uevent` file parsed by hand, and the usage page `0xF1D0` read through `HIDIOCGRDESC`. No libudev, and therefore no cgo."
[[params.repos]]
  name = "factors"
  kind = "factors"
  type = "lib"
  version = "v0.1.0"
  ci = true
  blurb = "The security key as an `mfa.Factor`. Almost nothing is here on purpose — asking a key is the same everywhere CTAP is. What stays is what only Linux knows: where a key is, and that one you may not *open* is not one that refused."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"
